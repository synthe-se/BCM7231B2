# mdev (started by rcS: -s at boot, then a daemon): device nodes as they come and go. Every node
# no line matches gets mdev's default, 0660 root:root, so the nodes every user needs are said
# first (a service user without /dev/null or /dev/urandom dies: 2026-11-21). Serial adapters (the
# Zigbee dongle) for the group dialout, which the service maison is in.
null      root:root 0666
zero      root:root 0666
full      root:root 0666
random    root:root 0666
urandom   root:root 0666
tty       root:root 0666
ptmx      root:root 0666
ttyUSB[0-9]* root:dialout 0660
ttyACM[0-9]* root:dialout 0660
